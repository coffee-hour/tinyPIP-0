<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="web/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tinyPIP-0</title>
<style>
  :root { --bg: #000; --fg: #ececec; --mid: #8a8a8a; --dim: #4a4a4a; --line: #242424; --bubble: #141414; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  #status { font-size: 12px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: var(--fg); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.pip { align-self: flex-start; background: var(--bubble); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--mid); font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .empty { margin: auto; color: var(--dim); text-align: center; font-size: 14px; }
  form {
    border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto;
  }
  #input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
    border: 1px solid var(--dim); border-radius: 999px; padding: 10px 16px; font: inherit; outline: none;
  }
  #input:focus { border-color: var(--mid); }
  #input::placeholder { color: var(--dim); }
  button {
    background: var(--fg); color: var(--bg); border: 0; border-radius: 999px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: var(--dim); color: var(--bg); cursor: default; }
  @media (max-width: 480px) {
    body { font-size: 15px; }
    .msg { max-width: 90%; }
    header, #log, form { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>tinyPIP-0</h1>
  <div id="status">loading model...</div>
</header>

<div id="log">
  <div class="empty" id="empty">A tiny model running in your browser. Replies are short and rough.</div>
</div>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="Message Pip" maxlength="400" aria-label="Message Pip">
  <button id="send" type="submit" disabled>Send</button>
</form>

<script src="app.js?v=2"></script>
</body>
</html>
