name: Train tinyPIP-0

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps to reach (train.py --steps)"
        required: true
        default: "20000"
        type: string
      huge_data:
        description: "Fetch SmolTalk data first (train.sh --huge-data)"
        required: false
        default: false
        type: boolean
      max_mb:
        description: "MB of SmolTalk data to fetch when huge_data is true (--max-mb)"
        required: false
        default: "15"
        type: string
      resume_from_latest:
        description: "Download the latest successful run's checkpoint into out/ before training"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Validate inputs
        env:
          STEPS: ${{ inputs.steps }}
          MAX_MB: ${{ inputs.max_mb }}
        run: |
          case "$STEPS" in ''|*[!0-9]*) echo "steps must be a non-negative integer"; exit 1 ;; esac
          case "$MAX_MB" in ''|*[!0-9]*) echo "max_mb must be a positive integer"; exit 1 ;; esac

      - name: Fetch latest checkpoint from previous successful run
        if: ${{ inputs.resume_from_latest }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          RUN_ID=$(gh run list --workflow train.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$CURRENT_RUN" ]; then
            echo "No previous successful run found. Training from scratch."
            exit 0
          fi
          echo "Downloading tinypip0-checkpoint from run $RUN_ID"
          mkdir -p out
          if gh run download "$RUN_ID" -n tinypip0-checkpoint -D out && [ -f out/tinypip0.pt ]; then
            echo "Restored out/tinypip0.pt. Training will resume from it."
          else
            echo "::warning::Could not restore checkpoint from run $RUN_ID. Training from scratch."
            rm -f out/tinypip0.pt
          fi

      - name: Train
        env:
          STEPS: ${{ inputs.steps }}
          HUGE_DATA: ${{ inputs.huge_data }}
          MAX_MB: ${{ inputs.max_mb }}
        run: |
          if [ "$HUGE_DATA" = "true" ]; then
            bash train.sh --huge-data --max-mb "$MAX_MB" --steps "$STEPS"
          else
            bash train.sh --steps "$STEPS"
          fi

      - name: Upload checkpoint artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: tinypip0-checkpoint
          path: out/tinypip0.pt
          if-no-files-found: error
          retention-days: 14

      - name: Export browser weights
        if: success()
        run: python export_web.py --ckpt out/tinypip0.pt --out web/model

      - name: Commit checkpoint and browser weights to main
        if: success()
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/tinypip0.pt web/model/weights.bin web/model/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(weights): update trained checkpoint to step $STEPS [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
